[project]
name = 'ptbr-sampler'
version = '0.3.0'
description = 'Brazilian Name and Location Generator'
authors = [{name = 'arthrod', email = 'arthrod@gmail.com'}]
requires-python = '>=3.12'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
keywords = ['brazil', 'name', 'location', 'generator']
classifiers = [
    'Development Status :: 4 - Beta',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
dependencies = [
    'tqdm>=4.70.1',
    'typer>=0.28.0',
    'python-dotenv>=1.2.4',
    'loguru>=0.7.3',
    'rich>=15.0.0',
    'aiofiles>=25.1.0',
    # Vectorised sampling primitives (see docs/architecture.md).
    'numpy>=2.5.4',
    # Partitioned Parquet store under ptbr_sampler/data/parquet.
    'pyarrow>=26.0.1',
]

[project.urls]
Homepage = 'https://github.com/jandira-tech/ptbr-sampler'
Repository = 'https://github.com/jandira-tech/ptbr-sampler'
Issues = 'https://github.com/jandira-tech/ptbr-sampler/issues'

[project.scripts]
ptbr = 'ptbr_sampler.cli:main'

[project.optional-dependencies]

faker = [
    'faker>=40.44.0',
]

test = [
    'pytest>=9.2.0',
    'pytest-asyncio>=1.4.1.post1',
    'pytest-cov>=7.1.0',
    'pytest-mock>=3.17.0',
    'pytest-timeout>=2.4.0',
    'pytest-xdist>=3.8.0',
    'coverage[toml]>=7.17.2',
    'scipy>=1.18.1',
]

dev = [
    'uv>=0.13.7',
    'ruff>=0.17.4',
    'ipykernel>=7.4.0',
    'marimo>=0.25.2',
    'nbclient>=0.11.0',
    'nbconvert>=7.17.2',
]

[build-system]
requires = ['uv_build>=0.13.7,<0.14']
build-backend = 'uv_build'

[tool.uv.build-backend]
module-name = 'ptbr_sampler'
module-root = ''
source-include = ['ptbr_sampler/data/**']

[tool.ruff]
include = [
    'pyproject.toml',
    'ptbr_sampler/**/*.py',
    'scripts/**/*.py',
]
line-length = 140
fix = true
target-version = 'py312'
exclude = [
    'build',
    'dist',
    '*.egg-info',
    'ptbr_sampler/tests',
    'ptbr_sampler/add_city_name.py',
    'ptbr_sampler/examine_data.py',
    'ptbr_sampler/merge_city_data.py',
    'ptbr_sampler/sample1.py',
    'ptbr_sampler/sample2.py',
    'ptbr_sampler/teste.py',
    'ptbr_sampler/utils/cep_wrapper.py',
]


[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['E402']
'**/{tests,docs,tools}/*' = ['E402']
'nbs/*' = ['E402', 'F401']


[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true
docstring-code-line-length = 'dynamic'

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = '3.12'
strict = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    'openai.*',
    'google.*',
    'PyPDF2.*',
    'litellm.*',
    'crewai.*',
    'serpapi.*',
    'aiosmtplib.*',
    'aioimaplib.*',
	'tests.*',
]
disable_error_code = ['union-attr', 'arg-type']
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=ptbr_sampler"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests that run statistical validation (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["ptbr_sampler"]
omit = [
    # Duplicate / stale test tree copied under the package.
    "ptbr_sampler/tests/*",
    # One-off maintenance scripts that execute at import time.
    "ptbr_sampler/add_city_name.py",
    "ptbr_sampler/examine_data.py",
    "ptbr_sampler/merge_city_data.py",
    # Deprecated sampler variants left behind for historical reference.
    "ptbr_sampler/sample1.py",
    "ptbr_sampler/sample2.py",
    "ptbr_sampler/teste.py",
    # Network-bound CEP resolver; exercised via integration only.
    "ptbr_sampler/utils/cep_wrapper.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.nbdev]
lib_path = "ptbr_sampler"
nbs_path = "nbs"
recursive = true
toc = true
clean_ids = true
black_formatting = false

[tool.ruff.lint]
ignore = ['TRY401', 'TRY300', 'G202', 'G004', 'ISC001', 'W191', 'COM812', 'W292', 'C408', 'COM819', 'E731', 'ERA001', 'G004', 'RET503', 'RUF012', 'S311', 'SIM108', 'SIM300', 'T201', 'TRY003', 'TRY301', 'W293']
select = ['A', 'ASYNC', 'B', 'BLE', 'C4', 'COM', 'DTZ', 'E', 'ERA', 'EXE', 'F', 'FLY', 'G', 'I', 'ICN', 'ISC', 'LOG', 'PERF', 'PIE', 'PLC', 'PLE', 'PLW', 'PT', 'PTH', 'RET', 'RUF', 'S', 'SIM', 'T', 'TRY', 'UP', 'W']
unfixable = ['B']
