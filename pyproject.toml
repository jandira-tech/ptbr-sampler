[project]
name = 'ptbr-sampler'
version = '0.3.0'
description = 'Empirically grounded Brazilian demographic, location, and synthetic document sampler backed by IBGE Census 2022'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE', 'THIRD_PARTY_NOTICES.md']
authors = [
    {name = 'Jandira Tech'},
    {name = 'Arthur Souza Rodrigues', email = 'arthrod@gmail.com'},
]
requires-python = '>=3.12'
keywords = [
    'brazil',
    'pt-br',
    'ibge',
    'census-2022',
    'synthetic-data',
    'faker',
    'names',
    'surnames',
    'cep',
    'cpf',
    'cnpj',
    'data-science',
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Natural Language :: Portuguese (Brazilian)',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Testing',
    'Typing :: Typed',
]
dependencies = [
    'tqdm>=4.67.1',
    'typer>=0.15.0',
    'python-dotenv>=1.0.1',
    'loguru>=0.7.3',
    'rich>=14.0.0',
    'aiofiles>=24.1.0',
    # Vectorised sampling primitives (see docs/architecture.md).
    'numpy>=2.0',
    # Partitioned Parquet store fetched lazily into runtime cache.
    'pyarrow>=17.0',
]

[project.urls]
Homepage = 'https://github.com/jandira-tech/ptbr-sampler'
Documentation = 'https://ptbr-sampler.readthedocs.io/'
Repository = 'https://github.com/jandira-tech/ptbr-sampler'
Dataset = 'https://huggingface.co/datasets/arthrod/ptbr-sampler-data'
Issues = 'https://github.com/jandira-tech/ptbr-sampler/issues'
Changelog = 'https://github.com/jandira-tech/ptbr-sampler/blob/main/CHANGELOG.md'

[project.scripts]
ptbr = 'ptbr_sampler.cli:main'

[project.optional-dependencies]
faker = [
    'faker>=30.0',
]

docs = [
    'mkdocs>=1.6',
    'mkdocs-material>=9.5',
    'pymdown-extensions>=10.12',
]

test = [
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
    'pytest-cov>=6.0',
    'pytest-mock>=3.14',
    'pytest-timeout>=2.3',
    'pytest-xdist>=3.6',
    'coverage[toml]>=7.6',
    'scipy>=1.14',
    'faker>=30.0',
]

dev = [
    'uv>=0.13.7',
    'ruff>=0.8',
    'huggingface-hub>=0.26',
]

[build-system]
requires = ['uv_build>=0.5,<0.14']
build-backend = 'uv_build'

[tool.uv.build-backend]
module-name = 'ptbr_sampler'
module-root = ''
wheel-exclude = [
    'ptbr_sampler/data/parquet/**',
    'ptbr_sampler/data/raw/**',
    'ptbr_sampler/data/cities_with_ceps.json',
    'ptbr_sampler/data/locations_data*.json*',
    'ptbr_sampler/data/names_data.json',
    'ptbr_sampler/data/surnames_data.json',
    'ptbr_sampler/data/middle_names.json',
    'ptbr_sampler/tests/**',
    'ptbr_sampler/add_city_name.py',
    'ptbr_sampler/examine_data.py',
    'ptbr_sampler/merge_city_data.py',
    'ptbr_sampler/sample1.py',
    'ptbr_sampler/sample2.py',
    'ptbr_sampler/teste.py',
]
source-exclude = [
    'ptbr_sampler/data/parquet/**',
    'ptbr_sampler/data/raw/**',
    'ptbr_sampler/data/cities_with_ceps.json',
    'ptbr_sampler/data/locations_data*.json*',
    'ptbr_sampler/data/names_data.json',
    'ptbr_sampler/data/surnames_data.json',
    'ptbr_sampler/data/middle_names.json',
    'ptbr_sampler/tests/**',
    'ptbr_sampler/add_city_name.py',
    'ptbr_sampler/examine_data.py',
    'ptbr_sampler/merge_city_data.py',
    'ptbr_sampler/sample1.py',
    'ptbr_sampler/sample2.py',
    'ptbr_sampler/teste.py',
]

[tool.ruff]
include = [
    'pyproject.toml',
    'ptbr_sampler/**/*.py',
    'scripts/**/*.py',
]
line-length = 140
fix = true
target-version = 'py312'
exclude = [
    'build',
    'dist',
    '*.egg-info',
    'ptbr_sampler/tests',
    'ptbr_sampler/add_city_name.py',
    'ptbr_sampler/examine_data.py',
    'ptbr_sampler/merge_city_data.py',
    'ptbr_sampler/sample1.py',
    'ptbr_sampler/sample2.py',
    'ptbr_sampler/teste.py',
    'ptbr_sampler/utils/cep_wrapper.py',
]


[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['E402']
'**/{tests,docs,tools}/*' = ['E402']
'nbs/*' = ['E402', 'F401']


[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true
docstring-code-line-length = 'dynamic'

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
python_version = '3.12'
strict = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    'openai.*',
    'google.*',
    'PyPDF2.*',
    'litellm.*',
    'crewai.*',
    'serpapi.*',
    'aiosmtplib.*',
    'aioimaplib.*',
	'tests.*',
]
disable_error_code = ['union-attr', 'arg-type']
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=ptbr_sampler"
testpaths = ["tests"]
markers = [
    "slow: marks tests that run statistical validation (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["ptbr_sampler"]
omit = [
    # Duplicate / stale test tree copied under the package.
    "ptbr_sampler/tests/*",
    # One-off maintenance scripts that execute at import time.
    "ptbr_sampler/add_city_name.py",
    "ptbr_sampler/examine_data.py",
    "ptbr_sampler/merge_city_data.py",
    # Deprecated sampler variants left behind for historical reference.
    "ptbr_sampler/sample1.py",
    "ptbr_sampler/sample2.py",
    "ptbr_sampler/teste.py",
    # Network-bound CEP resolver; exercised via integration only.
    "ptbr_sampler/utils/cep_wrapper.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.nbdev]
lib_path = "ptbr_sampler"
nbs_path = "nbs"
recursive = true
toc = true
clean_ids = true
black_formatting = false

[tool.ruff.lint]
ignore = ['TRY401', 'TRY300', 'G202', 'G004', 'ISC001', 'W191', 'COM812', 'W292', 'C408', 'COM819', 'E731', 'ERA001', 'G004', 'RET503', 'RUF012', 'S311', 'SIM108', 'SIM300', 'T201', 'TRY003', 'TRY301', 'W293']
select = ['A', 'ASYNC', 'B', 'BLE', 'C4', 'COM', 'DTZ', 'E', 'ERA', 'EXE', 'F', 'FLY', 'G', 'I', 'ICN', 'ISC', 'LOG', 'PERF', 'PIE', 'PLC', 'PLE', 'PLW', 'PT', 'PTH', 'RET', 'RUF', 'S', 'SIM', 'T', 'TRY', 'UP', 'W']
unfixable = ['B']
