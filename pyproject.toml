[project]
name = 'br-name-location-generator'         
version = '0.1.0'                  
description = 'Brazilian Name and Location Generator' 
authors = [{name = 'arthrod', email = 'arthrod@gmail.com'}]
requires-python = '>=3.12'         
keywords = ['brazil', 'name', 'location', 'generator']
dependencies = [
    'tqdm>=4.67.1',
    'typer>=0.15.0',
    'python-dotenv>=1.0.1',
    'loguru>=0.7.3',
    'rich>=14.0.0',
    'richer>=0.1.6',
    'aiofiles>=24.1.0',
    # Vectorised sampling primitives (see docs/architecture.md).
    'numpy>=2.0',
    # Partitioned Parquet store under src/data/parquet.
    'pyarrow>=17.0',
]

[project.optional-dependencies]

test = [
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
    'pytest-cov>=6.0',
    'pytest-mock>=3.14',
    'pytest-timeout>=2.3',
    'pytest-xdist>=3.6',
    'coverage[toml]>=7.6',
    'scipy>=1.14',
]

dev = [
    'uv>=0.5',
    'ruff>=0.8',
]

[build-system]
requires = ['hatchling']           
build-backend = 'hatchling.build'   

[tool.ruff]
include = [                        
    'pyproject.toml',
    'src/**/*.{py,js,jsx,ts,tsx,css,scss,html,sh,yaml,yml}',
    'scripts/**/*.{py,js,jsx,ts,tsx,css,scss,html,sh,yaml,yml}', 
]
line-length = 140
fix = true
target-version = 'py312'           
exclude = ['build', 'dist', '*.egg-info']

         
[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['E402']         
'**/{tests,docs,tools}/*' = ['E402'] 
'nbs/*' = ['E402', 'F401']  


[tool.ruff.format]
quote-style = 'single'             
docstring-code-format = true      
docstring-code-line-length = 'dynamic'  

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true         

[tool.hatch.build.targets.wheel]
packages = ['src']                 

[tool.mypy]
python_version = '3.12'           
strict = true      
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    'openai.*',
    'google.*',
    'PyPDF2.*',
    'litellm.*',
    'crewai.*',
    'serpapi.*',
    'aiosmtplib.*',
    'aioimaplib.*',
	'tests.*',
]
disable_error_code = ['union-attr', 'arg-type']
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src"
testpaths = ["tests"]
markers = [
    "slow: marks tests that run statistical validation (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["src"]
omit = [
    # Duplicate / stale test tree copied under src/.
    "src/tests/*",
    # One-off maintenance scripts that execute at import time.
    "src/add_city_name.py",
    "src/examine_data.py",
    "src/merge_city_data.py",
    # Deprecated sampler variants left behind for historical reference.
    "src/sample1.py",
    "src/sample2.py",
    "src/teste.py",
    # Network-bound CEP resolver; exercised via integration only.
    "src/utils/cep_wrapper.py",
    # CLI depends on an unreleased ``ptbr_sampler`` package split; exercised
    # only through its ImportError fallback in src/__init__.py.
    "src/cli.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.nbdev]
lib_path = "src"
nbs_path = "nbs"
recursive = true
toc = true
clean_ids = true
black_formatting = false  

[tool.ruff.lint]
ignore = ['TRY401', 'TRY300', 'G202', 'G004', 'ISC001', 'W191', 'COM812', 'W292', 'C408', 'COM819', 'E731', 'ERA001', 'G004', 'RET503', 'RUF012', 'S311', 'SIM108', 'SIM300', 'T201', 'TRY003', 'TRY301', 'W293']
select = ['A', 'ASYNC', 'B', 'BLE', 'C4', 'COM', 'DTZ', 'E', 'ERA', 'EXE', 'F', 'FLY', 'G', 'I', 'ICN', 'ISC', 'LOG', 'PERF', 'PIE', 'PLC', 'PLE', 'PLW', 'PT', 'PTH', 'RET', 'RUF', 'S', 'SIM', 'T', 'TRY', 'UP', 'W']
unfixable = ['B']        
