# Read the Docs configuration for https://ptbr-sampler.readthedocs.io/
# Import https://github.com/jandira-tech/ptbr-sampler on Read the Docs and this
# file is picked up automatically (MkDocs builder).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # Install the package itself (mkdocstrings imports it to render the API
    # reference) plus the Faker extra so ptbr_sampler.faker imports cleanly.
    - method: pip
      path: .
      extra_requirements:
        - faker
    - requirements: docs/requirements.txt
